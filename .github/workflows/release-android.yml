# Build the downloadable Android APK.
#
# The app is standalone: it carries its own database and runs the server's own
# route code on the device, so a phone with no network is a complete
# installation rather than a viewer for a cached copy. Attaching it to a server
# stays available under Backup / Sync and is never required.
#
# The Android project itself is generated rather than committed — Capacitor
# produces it from capacitor.config.json, so there is no large generated Gradle
# tree in the repository to drift out of date.
name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Attach the APK to a GitHub release'
        type: boolean
        default: false
      tag:
        description: 'Existing tag to build and attach to (e.g. v2.1.0). Leave blank to build the default branch.'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A re-run against an existing tag builds that tag's code, so a fix
          # to the workflow can be applied without deleting a published tag.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      # Keep the app version in step with the tag, so the APK reports the same
      # version as the release it came from.
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          TAG="${TAG#v}"
          npm version "$TAG" --no-git-tag-version --allow-same-version

      # The phone runs these; they are copied from server/ rather than kept as
      # a second copy in the repository.
      - name: Stage the embedded server files
        run: npm run embed

      # Proves the device answers exactly what the server answers before an APK
      # is built from it. A divergence here would be a different tonnage on the
      # phone from the one on the ship's computer.
      - name: Parity check — device against server
        run: |
          npx playwright install --with-deps chromium
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3080/api/health >/dev/null && break
            sleep 2
          done
          npm run parity

      - name: Generate the Android project
        run: npx cap add android

      # Launcher icons for every screen density, and the two adaptive layers a
      # launcher masks into a circle or a squircle. Generated from the SVG
      # masters so the mark on the home screen is the same one in the browser
      # tab and on the installer.
      - name: Generate the launcher icons
        run: npx capacitor-assets generate --android

      - name: Sync web assets
        run: npx cap sync android

      # Capacitor's template is unsigned and hardcodes version 1.0. Patch
      # versionCode/versionName and attach the committed sideload keystore so
      # phones can install the APK and later updates overwrite in place.
      - name: Version + sideload signing keystore
        run: node scripts/android-release-prep.js

      - name: Build the signed APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SRC" ]; then
            # Fall back if Gradle named it differently
            SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          fi
          cp "$SRC" "dist/TankChief-$VERSION.apk"
          ls -lh dist/
          # Prove the APK is signed (unsigned releases are not installable).
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "dist/TankChief-$VERSION.apk"

      # Signed with signing/tankchief-sideload.keystore (stable across releases).
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: false
          # No body here on purpose: the desktop workflow writes the release
          # description. Two workflows both appending to the same release is
          # how the v2.1.1 notes ended up saying everything twice.
