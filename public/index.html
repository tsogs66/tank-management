<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1420">
  <meta name="author" content="Marvin C. Endozo (ts0gs)">
  <meta name="license-api" content="">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Tank Chief</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/app.css?v=66">
  <script>
    try {
      if (localStorage.getItem('marine_bright') === '1' || localStorage.getItem('vm_bright') === '1') {
        document.documentElement.classList.add('bright');
      }
    } catch (_e) {}
  
    /* Keep phone/tablet browsers on the mobile layout (block “Desktop site”). */
    (function lockMobileViewport() {
      const WANT = 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover';
      function apply() {
        let meta = document.querySelector('meta[name="viewport"]');
        if (!meta) {
          meta = document.createElement('meta');
          meta.setAttribute('name', 'viewport');
          document.head.appendChild(meta);
        }
        if (meta.getAttribute('content') !== WANT) meta.setAttribute('content', WANT);
      }
      apply();
      try {
        const mo = new MutationObserver(apply);
        mo.observe(document.documentElement, { attributes: true, subtree: true, attributeFilter: ['content', 'name'] });
      } catch (_e) {}
      setInterval(apply, 1500);
    })();
</script>
</head>
<body>
  <button class="menu-toggle" id="menu-toggle" aria-label="Menu">☰ Menu</button>
  <button type="button" class="theme-toggle theme-fab no-print" data-theme-toggle aria-pressed="false" title="Day / bright mode for sunlight">Bright</button>

  <script src="/js/license-config.js"></script>

    window.CHENG_LICENSE_SKU = 'tank-chief';
    window.CHENG_LICENSE_PRODUCT = 'Tank Chief';
    try {
      var licMeta = document.querySelector('meta[name="license-api"]');
      if (!window.CHENG_LICENSE_API && licMeta && licMeta.content) {
        window.CHENG_LICENSE_API = licMeta.content;
      }
    } catch (_e) {}
  </script>
