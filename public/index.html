  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Tank Chief</title>
  <script>
    /* ChEng AIO serves this app under /tanks/ — set prefix + base before assets load. */
    (function mountUnderTanks() {
      try {
        var path = location.pathname || '';
        var under = path === '/tanks' || path.indexOf('/tanks/') === 0;
        if (typeof window.CHENG_PRO_TANKS_PREFIX !== 'string') {
          window.CHENG_PRO_TANKS_PREFIX = under ? '/tanks' : '';
        }
        if (under && typeof window.CHENG_PRO_EMBEDDED_BASE !== 'string') {
          window.CHENG_PRO_EMBEDDED_BASE = '/tanks/embedded/';
        }
        if (under && !document.querySelector('base')) {
          var b = document.createElement('base');
          b.href = '/tanks/';
          document.head.insertBefore(b, document.head.firstChild);
        }
      } catch (_e) {}
    })();
    try {
      if (localStorage.getItem('marine_bright') === '1' || localStorage.getItem('vm_bright') === '1') {
        document.documentElement.classList.add('bright');
      }
    } catch (_e) {}

    /* Mobile/Android: always bottom nav (portrait + landscape). Windows desktop keeps sidebar. */
    (function preferBottomNav() {
      function isMobileChrome() {
        try {
          var cap = window.Capacitor;
          var native = !!(cap && (cap.isNativePlatform
            ? cap.isNativePlatform()
            : (cap.getPlatform && cap.getPlatform() !== 'web')));
          var ua = navigator.userAgent || '';
          if (native || /Android|iPhone|iPad|iPod/i.test(ua)) return true;
        } catch (_e) {}
        var w = window.innerWidth || document.documentElement.clientWidth || 0;
        return w > 0 && w <= 900;
      }
      function apply() {
        try {
          var mobile = isMobileChrome();
          document.documentElement.classList.toggle('use-bottom-nav', mobile);
          document.documentElement.classList.toggle('is-mobile-chrome', mobile);
          if (!mobile) document.documentElement.classList.remove('nav-open');
        } catch (_e) {}
      }
      apply();
      window.addEventListener('resize', apply);
      window.addEventListener('orientationchange', function () { setTimeout(apply, 120); });
      document.addEventListener('deviceready', apply, { once: true });
      window.addEventListener('capacitorReady', apply, { once: true });
    })();
    try {
      if (/[?&]chengaio=1\b/.test(location.search || '') || localStorage.getItem('chengAioEmbedded') === '1') {
        document.documentElement.classList.add('chengaio-embed');
      }
    } catch (_e) {}

    /* Keep phone/tablet browsers on the mobile layout (block “Desktop site”). */
    (function lockMobileViewport() {
      const WANT = 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover';
      function apply() {
        let meta = document.querySelector('meta[name="viewport"]');
        if (!meta) {
          meta = document.createElement('meta');
          meta.setAttribute('name', 'viewport');
          document.head.appendChild(meta);
        }
        if (meta.getAttribute('content') !== WANT) meta.setAttribute('content', WANT);
      }
      apply();
      try {
        const mo = new MutationObserver(apply);
        mo.observe(document.documentElement, { attributes: true, subtree: true, attributeFilter: ['content', 'name'] });
      } catch (_e) {}
      setInterval(apply, 1500);
    })();
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
